server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: drivers
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**
        - id: location
          uri: lb://location-service
          predicates:
            - Path=/api/v1/locations/**
        - id: pricing
          uri: lb://pricing-service
          predicates:
            - Path=/api/v1/pricing/**
        - id: trips
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**
        - id: payments
          uri: lb://payment-wallet-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
