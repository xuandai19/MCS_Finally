server:
  port: ${SERVER_PORT:8761}
spring:
  application:
    name: discovery-server
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: false
    fetch-registry: false
